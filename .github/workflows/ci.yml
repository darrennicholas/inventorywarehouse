name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inventorywarehouse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventorywarehouse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventorywarehouse_test?schema=public
      SESSION_SECRET: ci-only-secret-at-least-32-characters-long
      FRONTEND_URL: http://localhost:3000
      NODE_ENV: test
      RUN_INTEGRATION_TESTS: "true"
      # Used only to create the disposable CI fixture database.
      ADMIN_EMAIL: admin@stockflow.local
      ADMIN_PASSWORD: ci-only-password-for-disposable-database
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # The rollback integration test only needs an authenticated user; keep
      # CI fixtures minimal instead of loading the full demo dataset.
      - run: npm run seed:access
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:contract
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  staging-smoke:
    name: Ephemeral staging, E2E, backup and restore smoke
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inventorywarehouse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inventorywarehouse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventorywarehouse_test?schema=public
      SESSION_SECRET: ci-only-secret-at-least-32-characters-long
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NODE_ENV: production
      ADMIN_EMAIL: admin@stockflow.local
      ADMIN_PASSWORD: ci-only-password-for-disposable-database
      E2E_ADMIN_EMAIL: admin@stockflow.local
      E2E_ADMIN_PASSWORD: ci-only-password-for-disposable-database
      E2E_BASE_URL: http://localhost:3000
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Prepare disposable staging database and backend
        working-directory: backend
        run: |
          npm ci --include=dev
          npx prisma generate
          npx prisma migrate deploy
          npm run seed:access
          npm run build
      - name: Verify PostgreSQL backup can be restored
        run: |
          pg_dump --host=localhost --username=postgres --dbname=inventorywarehouse_test --format=custom --file=/tmp/stockflow-staging.dump
          createdb --host=localhost --username=postgres inventorywarehouse_restore
          pg_restore --exit-on-error --no-owner --no-privileges --dbname=postgresql://postgres:postgres@localhost:5432/inventorywarehouse_restore /tmp/stockflow-staging.dump
          restored_roles="$(psql postgresql://postgres:postgres@localhost:5432/inventorywarehouse_restore --tuples-only --no-align --command='SELECT count(*) FROM "Role"')"
          restored_admins="$(psql postgresql://postgres:postgres@localhost:5432/inventorywarehouse_restore --tuples-only --no-align --command='SELECT count(*) FROM "User" WHERE "email" = '\''admin@stockflow.local'\''')"
          test "$restored_roles" -ge 5
          test "$restored_admins" -eq 1
      - name: Install frontend dependencies and generate API types
        working-directory: frontend
        run: |
          npm ci --include=dev
          npm run api:contract
          npx tsc --noEmit
          npm run build
          npx playwright install --with-deps chromium
      - name: Start the staged backend and frontend
        run: |
          (cd backend && nohup node dist/server.js > /tmp/stockflow-backend.log 2>&1 &)
          (cd frontend && nohup npm run start > /tmp/stockflow-frontend.log 2>&1 &)
          for attempt in $(seq 1 45); do
            if curl --silent --fail http://localhost:5000/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail http://localhost:5000/api/health
          curl --fail http://localhost:5000/api/database-check
          for attempt in $(seq 1 45); do
            if curl --silent --fail http://localhost:3000/ >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:3000/ >/dev/null
      - name: Run browser end-to-end smoke tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Print service logs on failure
        if: failure()
        run: |
          echo '--- backend ---'
          tail -n 120 /tmp/stockflow-backend.log || true
          echo '--- frontend ---'
          tail -n 120 /tmp/stockflow-frontend.log || true
